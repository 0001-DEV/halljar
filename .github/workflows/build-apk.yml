name: Build Flutter Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Halljar Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Generate Android Project
        run: |
          cd mobile
          flutter create . --org com.halljar --project-name halljar_mobile --platforms=android

      - name: Configure Android Permissions
        run: |
          cd mobile
          # Ensure INTERNET and ACCESS_NETWORK_STATE permissions are present
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile
          flutter build apk --release -v

      - name: Prepare Direct APK
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk mobile/build/app/outputs/flutter-apk/halljar.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halljar-app-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Halljar Mobile App v1.0.0"
          body: "Direct 1-tap download for Android. Click `halljar.apk` below to download and install immediately without unzipping."
          files: mobile/build/app/outputs/flutter-apk/halljar.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
